name: Validate

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check server.js
      - name: Check inline browser JavaScript
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          for src in ["frontend/CompetitiveExamMaster-student.html","frontend/CompetitiveExamMaster-admin.html"]:
              text=Path(src).read_text(encoding="utf-8")
              scripts=re.findall(r"<script(?:\s[^>]*)?>([\s\S]*?)</script>",text,re.I)
              Path("/tmp/"+Path(src).stem+".js").write_text("\n".join(scripts),encoding="utf-8")
          PY
          node --check /tmp/CompetitiveExamMaster-student.js
          node --check /tmp/CompetitiveExamMaster-admin.js
      - name: Security hardening checks
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          server=Path("server.js").read_text(encoding="utf-8")
          student=Path("frontend/CompetitiveExamMaster-student.html").read_text(encoding="utf-8")
          admin=Path("frontend/CompetitiveExamMaster-admin.html").read_text(encoding="utf-8")
          for marker in [
              "const locks=(await allMap('attemptLocks/'",
              "const scores=(await allMap('scoreIndex/'",
              "Object.values((await allMap('scoreIndex/'+t.id))||{})",
              "'examAttempts'",
              "'webhookEvents'",
              "validateCsrf(req)","X-CSRF-Token","Strict-Transport-Security",
              "Permissions-Policy","Cross-Origin-Opener-Policy","rateLimit(req,'api-global'",
              "/api/auth/csrf","examAttempts/","serverStartedAt","serverExpiresAt",
              "serverCalculated:true","razorpayApi('GET','/payments/'"
          ]:
              assert marker in server, f"missing server security marker: {marker}"
          for marker in ["getCsrfToken()","X-CSRF-Token","/start',{}"]:
              assert marker in student, f"missing student security marker: {marker}"
          for marker in ["getCsrfToken()","X-CSRF-Token"]:
              assert marker in admin, f"missing admin security marker: {marker}"
          assert "attemptId:crypto.randomBytes(18)" not in server
          print("Security hardening static checks passed.")
          PY

